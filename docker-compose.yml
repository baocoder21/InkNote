# Local development services. Start with: docker compose up -d
services:
  db:
    image: postgres:17
    container_name: inknote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inknote}
      # Dev-only default. Override via a local .env file; never reuse in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inknote_dev}
      POSTGRES_DB: ${POSTGRES_DB:-inknote}
    ports:
      - "5432:5432"
    volumes:
      - inknote-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inknote} -d ${POSTGRES_DB:-inknote}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inknote-db-data:
