# nginx for the InkNote web image: static files + a reverse proxy to the API ("api" is the service name in docker-compose.yml).

# A WebSocket connection starts as a normal request with "Upgrade: websocket"; nginx must pass that on (SignalR).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Attachments are up to 10 MB (the API enforces it); leave room for the form around the file.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Cheap defences for every response.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # ---- the API ----
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- real-time (SignalR over WebSocket) ----
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h; # an idle connection is allowed to stay open
  }

  # ---- files that must be re-checked every time ----
  # The page and the service worker's own files decide which version of the app runs: if the browser cached them,
  # a new release would not be noticed. (An exact-match location wins over the regex below, so the worker is never "immutable".)
  # ("expires -1" sends "Cache-Control: no-cache". It is used instead of add_header because a location that has its own
  # add_header drops the ones declared at server level, which would remove the security headers above.)
  location = /index.html           { expires -1; }
  location = /ngsw.json            { expires -1; }
  location = /ngsw-worker.js       { expires -1; }
  location = /safety-worker.js     { expires -1; }
  location = /manifest.webmanifest { expires -1; }

  # ---- files whose name contains a content hash (main-N2SN2FHQ.js): a new build gets a NEW name, so cache them for a year ----
  location ~* "-[A-Za-z0-9_]{8}\.(js|css|woff2?|ttf)$" {
    expires 1y;
    try_files $uri =404;
  }

  # ---- everything else: a file if it exists, otherwise the app (the router draws /notes/123 in the browser) ----
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
