@if (store.loadingSelected()) {
  <div class="center">
    <nz-spin nzSimple />
  </div>
} @else if (store.selected(); as note) {
  <div class="editor">
    @if (conflict()) {
      <nz-alert
        class="banner"
        nzType="warning"
        nzShowIcon
        nzMessage="This note was changed somewhere else. Reload to get the latest version (your unsaved text will be replaced)."
        [nzAction]="reloadAction"
      />
      <ng-template #reloadAction>
        <button nz-button nzSize="small" (click)="reload()">Reload</button>
      </ng-template>
    }

    <header class="head">
      <input
        #titleInput
        class="head__title"
        placeholder="Untitled"
        aria-label="Note title"
        maxlength="200"
        [(ngModel)]="title"
        (keydown.enter)="onTitleEnter($event)"
      />
    </header>

    <div class="toolbar">
      <app-note-organization
        [notebookId]="note.notebookId"
        [isPinned]="note.isPinned"
        [status]="note.status"
        [tagIds]="note.tagIds"
        [notebooks]="org.notebookOptions()"
        [tags]="org.tags()"
        [disabled]="store.saving() || org.loading()"
        (changed)="changeOrganization($event)"
      />
      <nz-segmented class="toolbar__mode" [nzOptions]="viewOptions" [(ngModel)]="viewMode" />
    </div>

    @if (tooLong()) {
      <nz-alert
        nzType="error"
        nzShowIcon
        nzMessage="Too long to save (max 500,000 characters). Shorten the note to save it."
      />
    }

    <div class="panes" [class.panes--split]="viewMode() === 'split'">
      <!-- Kept alive (only hidden) in Preview mode so the cursor, scroll and undo history survive. -->
      <app-markdown-editor
        class="panes__editor"
        [class.hidden]="viewMode() === 'preview'"
        [(value)]="content"
      />
      @if (viewMode() !== 'edit') {
        <app-markdown-preview class="panes__preview" [source]="content()" />
      }
    </div>
  </div>
}
