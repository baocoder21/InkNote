<div class="layout">
  <app-notes-sidebar class="sidebar" [tagId]="tag() ?? null" [q]="q() ?? null" />

  <section class="pane">
    <!-- The pages inside read the local database, so they appear only once it is open. Without this a reload on
         /notes/<id> started the editor BEFORE the database was open and it failed with "Cannot load the note". -->
    @if (ready()) {
      <router-outlet />
    }
  </section>
</div>
